nodeLinker: node-modules

# Versions that more than one workspace depends on; packages refer to them as "catalog:".
# The root depends on vite too: its vitest runs every project and takes vite as a peer from the
# root; without it, vitest's own vite dependency resolves to a newer major than the web app's.
catalog:
  '@types/node': 25.9.6
  typescript: 7.0.2
  vite: 7.3.6
  vitest: 4.1.11
  zod: 4.6.7

# Delay newly published releases for seven days to reduce supply-chain risk.
npmMinimalAgeGate: 7d

# Don't run dependency lifecycle scripts. Whitelist a package that really needs
# its build script with `dependenciesMeta.<pkg>.built: true` in package.json.
enableScripts: false
