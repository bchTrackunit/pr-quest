# The Rust the desktop shell (src-tauri/) is built and checked with; rustup installs it, with
# these components and the release targets, on first use. Raise it in its own change.
[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
profile = "minimal"
