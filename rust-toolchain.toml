# The Rust the desktop shell (apps/desktop/src-tauri/) is built and checked with; rustup installs
# it, with these components and the release targets, on first use. Raise it in its own change.
# It is at the root because rustup looks for it from the cwd upward, and cargo runs from the root
# (`just desktop-check`) as well as from src-tauri/ (`tauri build`).
[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
profile = "minimal"
