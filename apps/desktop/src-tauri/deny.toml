# cargo-deny's checks of the Rust shell's crates: `just cargo-deny`.
# https://embarkstudios.github.io/cargo-deny/

[graph]
# The targets PR Quest is packaged for (scripts/desktop/targets.ts); other platforms' crates don't count.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
all-features = false

[advisories]
# Every RustSec advisory fails the check, unmaintained crates included, unless listed in `ignore`
# with the reason it doesn't affect PR Quest.
yanked = "deny"
unmaintained = "all"
ignore = [
  # Build-time macro crate of gtk-rs 0.18, which wry and tao use on Linux; nothing of it runs in the app.
  { id = "RUSTSEC-2024-0370", reason = "build-time only, via gtk-rs 0.18; no upgrade until Tauri moves off GTK 3" },
  # zbus 5 folded these into itself; the standalone crates get no more releases.
  { id = "RUSTSEC-2026-0370", reason = "zvariant: part of zbus 5, which tauri-plugin-opener and single-instance use; no upgrade yet" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: as zvariant" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: as zvariant" },
]

[licenses]
confidence-threshold = 0.9
# Permissive licenses, and MPL-2.0 (cssparser and selectors, via Tauri's HTML handling), which
# only asks that changes to its own files be shared; PR Quest ships them unchanged.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
# Tauri's dependency tree has many crates in two versions; that costs size, not safety.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
