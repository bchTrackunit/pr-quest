[package]
name = "pr-quest"
version = "0.0.0"
description = "PR Quest's desktop shell: a Tauri window over the PR Quest server, which runs as a Node sidecar"
edition = "2021"
rust-version = "1.85"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

# Exact pins at least seven days old, like .yarnrc.yml's npmMinimalAgeGate; Cargo has no age gate,
# so transitive crates in Cargo.lock aren't held back the same way.
[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-updater = "=2.14.0"
keyring = { version = "=3.6.3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
] }
base64 = "0.22"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
