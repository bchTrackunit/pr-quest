# Builds the Tauri desktop app on one runner per platform and processor, signs and smoke-tests
# each build, signs the update files in a job of their own, checks every update signature, writes
# the updater's latest.json and publishes it all to one draft GitHub Release. Pushing a v* tag
# releases; running the workflow by hand is a dry run that builds unsigned, with a throwaway
# updater key, keeps the files as workflow artifacts and publishes nothing. See RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  # The event is part of the group, so a dry run started on a tag can't cancel that tag's release.
  group: release-${{ github.event_name }}-${{ github.ref }}
  # Never stop a release halfway through publishing; a newer dry run replaces an older one.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Check the version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      dry-run-pubkey: ${{ steps.dry-run-key.outputs.pubkey }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # This job names no environment, so it sees only repository and organization secrets, which
      # every workflow run can read. The signing secrets belong in the release environment alone.
      # Each variable is only whether that secret is set, never its value.
      - name: Keep the signing secrets out of repository and organization secrets
        env:
          REPO_SECRET_SET_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          REPO_SECRET_SET_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
          REPO_SECRET_SET_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          REPO_SECRET_SET_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          REPO_SECRET_SET_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          REPO_SECRET_SET_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          REPO_SECRET_SET_APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 != '' }}
          REPO_SECRET_SET_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          REPO_SECRET_SET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD != '' }}
          REPO_SECRET_SET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          REPO_SECRET_SET_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID != '' }}
          REPO_SECRET_SET_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID != '' }}
          REPO_SECRET_SET_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          REPO_SECRET_SET_AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT != '' }}
          REPO_SECRET_SET_AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT != '' }}
          REPO_SECRET_SET_AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE != '' }}
          REPO_SECRET_SET_WINDOWS_PFX: ${{ secrets.WINDOWS_PFX != '' }}
          REPO_SECRET_SET_WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD != '' }}
        run: |
          exposed=""
          for flag in $(compgen -v REPO_SECRET_SET_); do
            if [[ "${!flag}" == true ]]; then
              exposed="${exposed:+$exposed, }${flag#REPO_SECRET_SET_}"
            fi
          done
          if [[ -n "$exposed" ]]; then
            echo "::error title=Exposed signing secrets::$exposed are repository or organization secrets, which every workflow run can read. Make them secrets of the release environment and delete the repository and organization ones; see RELEASING.md."
            exit 1
          fi

      - name: Match the tag to the app's version
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version="$(jq -r .version apps/desktop/package.json)"
          # Checked on dry runs too, so a bad version shows up before anyone tags it.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "::error title=Bad version::apps/desktop/package.json has version $version. Use major.minor.patch, with an optional prerelease part such as 1.2.0-beta.1."
            exit 1
          fi
          # The app reports its version to the updater, which Tauri takes from
          # apps/desktop/package.json. If it differed from the release's, every install would see
          # the release as new and update to it forever.
          tauri="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          if [[ "$tauri" != ../package.json ]]; then
            echo "::error title=Version mismatch::apps/desktop/src-tauri/tauri.conf.json has version $tauri. Set it to \"../package.json\", so the app's version is the release's."
            exit 1
          fi
          cargo="$(sed -n 's/^version = "\(.*\)"$/\1/p' apps/desktop/src-tauri/Cargo.toml | head -n 1)"
          if [[ "$cargo" != "$version" ]]; then
            echo "::error title=Version mismatch::apps/desktop/package.json has version $version, but apps/desktop/src-tauri/Cargo.toml $cargo. Set both, then update Cargo.lock."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            # The dry run's opt-out from code signing, if someone put it in this workflow's
            # top-level env, which every job inherits. A step's or another job's own env doesn't
            # reach here: package.sh refuses the opt-out in tag builds, and release-assets.sh
            # refuses bundles built with it.
            if [[ -n "${PR_QUEST_ALLOW_UNSIGNED_RELEASE:-}" ]]; then
              echo "::error title=Unsigned release::PR_QUEST_ALLOW_UNSIGNED_RELEASE is set for a tag build. Only the dry run may build unsigned."
              exit 1
            fi
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error title=Version mismatch::The tag is $GITHUB_REF_NAME, but apps/desktop/package.json has version $version. Tag the commit that sets the version, as v$version."
              exit 1
            fi
            # Catches a mistake, not an attacker: a tag build runs the tagged commit's own copy of
            # this workflow. The tag ruleset and the release environment are what keep the
            # signing secrets safe; see RELEASING.md.
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
              echo "::error title=Not on $DEFAULT_BRANCH::$GITHUB_REF_NAME points at a commit that isn't on $DEFAULT_BRANCH. Release from $DEFAULT_BRANCH."
              exit 1
            fi
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >>"$GITHUB_OUTPUT"
          echo "Version $version (prerelease: $prerelease)" >>"$GITHUB_STEP_SUMMARY"

      # Every installed app trusts this key for good, so a missing or wrong one stops the release
      # here, before anything is built with it. Dry runs check it too, when it is set.
      - name: Check the updater public key
        env:
          PUBKEY: ${{ vars.PR_QUEST_UPDATER_PUBKEY }}
        run: |
          if [[ -z "$PUBKEY" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == push ]]; then
              echo "::error title=Updater key::Set the repository variable PR_QUEST_UPDATER_PUBKEY to the updater's public key; see RELEASING.md."
              exit 1
            fi
            echo "::warning title=Updater key::The repository variable PR_QUEST_UPDATER_PUBKEY isn't set, so a tag build would stop."
            exit 0
          fi
          # Two lines: a comment, then the base64 of "Ed", the 8-byte key ID and the 32-byte key.
          decoded="$(printf '%s' "$PUBKEY" | base64 --decode 2>/dev/null)" || decoded=""
          printf '%s\n' "$decoded" | sed -n 2p | base64 --decode >"$RUNNER_TEMP/pubkey.bin" 2>/dev/null || true
          if [[ "$(printf '%s\n' "$decoded" | sed -n 1p)" != "untrusted comment: minisign public key"* ||
            "$(wc -c <"$RUNNER_TEMP/pubkey.bin" | tr -d ' ')" != 42 ||
            "$(head -c 2 "$RUNNER_TEMP/pubkey.bin")" != Ed ]]; then
            echo "::error title=Updater key::PR_QUEST_UPDATER_PUBKEY isn't a Tauri updater public key: the contents of the .pub file that \`tauri signer generate\` writes."
            exit 1
          fi
          if [[ "$PUBKEY" == "$(jq -r .plugins.updater.pubkey apps/desktop/src-tauri/tauri.conf.json)" ]]; then
            echo "::error title=Updater key::PR_QUEST_UPDATER_PUBKEY is the local development key from apps/desktop/src-tauri/tauri.conf.json. Generate a release key pair; see RELEASING.md."
            exit 1
          fi

      # What the build jobs check the signatures of a tag build against.
      - name: Check the signing variables
        if: github.event_name == 'push'
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          WINDOWS_SIGNER_SUBJECT: ${{ vars.WINDOWS_SIGNER_SUBJECT }}
        run: |
          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error title=Signing variables::Set the repository variable APPLE_TEAM_ID to the Team ID of the Developer ID certificate, ten letters and digits; see RELEASING.md."
            exit 1
          fi
          if [[ "$WINDOWS_SIGNER_SUBJECT" != *CN=* ]]; then
            echo "::error title=Signing variables::Set the repository variable WINDOWS_SIGNER_SUBJECT to the subject of the Windows signing certificate, such as CN=Octo Cat, O=Octo Cat, L=Copenhagen, C=DK; see RELEASING.md."
            exit 1
          fi

      # The app accepts an update only if it is signed with the key it was built with, so a dry
      # run, which can't use the release environment's private key, gets a key pair of its own.
      # Its apps only trust updates signed with it, and it is never used for anything else.
      - uses: ./.github/actions/setup-yarn
        if: github.event_name == 'workflow_dispatch'

      - name: Make a throwaway updater key for the dry run
        id: dry-run-key
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p "$RUNNER_TEMP/dry-run-key"
          yarn workspace @pr-quest/desktop exec tauri signer generate --ci -p '' \
            -w "$RUNNER_TEMP/dry-run-key/updater.key" >/dev/null
          echo "pubkey=$(cat "$RUNNER_TEMP/dry-run-key/updater.key.pub")" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: dry-run-updater-key
          path: ${{ runner.temp }}/dry-run-key/
          if-no-files-found: error
          retention-days: 1

  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-yarn

      # `just check` without its build, which every build job runs anyway.
      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Test
        run: yarn test

  check-desktop:
    name: Check the Rust shell
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-yarn

      - uses: ./.github/actions/setup-desktop

      - name: Format check, Clippy and tests of the Rust shell
        run: just desktop-check

      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-deny@0.20.2

      - name: Audit the Rust crates
        run: just cargo-deny

  build:
    name: Build ${{ matrix.name }}
    needs: [verify, check, check-desktop]
    runs-on: ${{ matrix.runner }}
    # The macOS and Windows signing secrets are secrets of the release environment, so only a job
    # that names it can read them, and only once its protection rules pass: a v* tag and a
    # reviewer's approval. Linux signs nothing, and no build job gets the updater's private key,
    # so the Linux builds and dry runs never name it.
    environment: ${{ github.event_name == 'push' && matrix.signed && 'release' || '' }}
    # Notarization alone can take a while.
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Yarn installs the Cursor SDK's native parts for the runner's own processor only, so every
      # target builds on a runner of its own. Linux builds on the oldest Ubuntu GitHub offers, so
      # the AppImage and deb run on every distribution with that glibc or newer.
      matrix:
        include:
          - id: mac-arm64
            name: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
            signed: true
          - id: mac-x64
            name: macOS x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            signed: true
          - id: win-x64
            name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            signed: true
          - id: linux-x64
            name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            signed: false
          - id: linux-arm64
            name: Linux arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            signed: false
    env:
      # A release build, the only kind that checks for updates, of the repository it updates from
      # and the release goes to; see apps/desktop/src-tauri/build.rs. Dry runs build the same, so
      # they test what a release ships, and trust their throwaway key.
      PR_QUEST_RELEASE_BUILD: '1'
      PR_QUEST_RELEASE_REPO: ${{ github.repository }}
      PR_QUEST_UPDATER_PUBKEY: ${{ github.event_name == 'push' && vars.PR_QUEST_UPDATER_PUBKEY || needs.verify.outputs.dry-run-pubkey }}
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-yarn

      - uses: ./.github/actions/setup-desktop
        with:
          linux-smoke: 'true'

      # yarn build, every crate's build script and proc macro, and the Tauri CLI run here, with no
      # secrets at all; package.sh refuses any it finds. The steps below only sign and bundle the
      # binary compiled here.
      - name: Compile
        run: bash scripts/ci/package.sh --target "$TARGET" --compile-only

      # Each secret reaches only the bundling step of its own platform. A dry run has no secrets,
      # so it opts out of code signing; package.sh refuses that in a tag build, and the build
      # record it writes stops release-assets.sh from accepting the bundles for one.
      - name: Bundle (dry run)
        if: github.event_name == 'workflow_dispatch'
        env:
          PR_QUEST_ALLOW_UNSIGNED_RELEASE: '1'
        run: bash scripts/ci/package.sh --target "$TARGET" --skip-compile

      - name: Bundle
        if: github.event_name == 'push' && runner.os == 'Linux'
        run: bash scripts/ci/package.sh --target "$TARGET" --skip-compile

      - name: Bundle and sign
        if: github.event_name == 'push' && runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/ci/package.sh --target "$TARGET" --skip-compile

      - name: Bundle and sign
        if: github.event_name == 'push' && runner.os == 'Windows'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          WINDOWS_PFX: ${{ secrets.WINDOWS_PFX }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: bash scripts/ci/package.sh --target "$TARGET" --skip-compile

      # The release files, with the macOS update archive: a tar.gz of the stapled app.
      - name: Collect the release files
        run: bash scripts/ci/collect-bundles.sh "$TARGET" "$VERSION" release-files --updater

      # Every tag build, whatever package.sh reported: the app, and the app in the update archive
      # that installed apps unpack, are signed by our team, notarized and stapled.
      - name: Check the signature and notarization
        if: github.event_name == 'push' && runner.os == 'macOS'
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          check() {
            codesign --verify --deep --strict --verbose=2 "$1"
            spctl --assess --type execute --verbose=2 "$1"
            xcrun stapler validate "$1"
            local team
            team="$(codesign --display --verbose=2 "$1" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
            if [[ "$team" != "$TEAM_ID" ]]; then
              echo "::error title=Code signature::$1 is signed by team \"$team\", not $TEAM_ID (the APPLE_TEAM_ID variable)."
              exit 1
            fi
            echo "$1: signed by team $team, notarized and stapled"
          }
          check "apps/desktop/src-tauri/target/$TARGET/release/bundle/macos/PR Quest.app"
          archives=(release-files/*.app.tar.gz)
          if [[ "${#archives[@]}" != 1 || ! -f "${archives[0]}" ]]; then
            echo "::error title=Code signature::Expected one update archive, found ${archives[*]}."
            exit 1
          fi
          mkdir "$RUNNER_TEMP/update"
          tar -xzf "${archives[0]}" -C "$RUNNER_TEMP/update"
          check "$RUNNER_TEMP/update/PR Quest.app"

      # Every tag build: installs the app as a user would and checks every program and library in
      # it, plus the installer itself, is validly signed with our certificate. Node keeps the
      # OpenJS Foundation's signature, which Tauri doesn't replace, so it only has to be valid.
      - name: Check the signatures
        if: github.event_name == 'push' && runner.os == 'Windows'
        shell: pwsh
        env:
          SIGNER_SUBJECT: ${{ vars.WINDOWS_SIGNER_SUBJECT }}
        run: |
          $installer = Get-Item "apps/desktop/src-tauri/target/$env:TARGET/release/bundle/nsis/*-setup.exe"
          $dir = Join-Path $env:RUNNER_TEMP 'installed\PR Quest'
          Start-Process -Wait -FilePath $installer.FullName -ArgumentList '/S', "/D=$dir"
          $files = @($installer) + @(Get-ChildItem -Recurse -File $dir | Where-Object { $_.Extension -in '.exe', '.dll', '.node' })
          $bad = 0
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            $subject = $signature.SignerCertificate.Subject
            "$($signature.Status) $($file.FullName) $subject"
            if ($signature.Status -ne 'Valid') {
              $bad++
            } elseif ($file.Name -ne 'pr-quest-node.exe' -and $subject -ne $env:SIGNER_SUBJECT) {
              "  not signed by $env:SIGNER_SUBJECT (the WINDOWS_SIGNER_SUBJECT variable)"
              $bad++
            }
          }
          # Without _?, NSIS copies the uninstaller to %TEMP% and returns while that copy runs.
          Start-Process -Wait -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S', "_?=$dir"
          Remove-Item -Recurse -Force $dir
          if ($bad -gt 0) { throw "$bad of $($files.Count) files aren't validly signed by us" }

      - name: Smoke test
        run: bash scripts/ci/smoke.sh "$TARGET"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.id }}
          path: release-files/
          if-no-files-found: error
          retention-days: 7
          # The installers are compressed already.
          compression-level: 0

  # The only job that gets the updater's private key, which every installed app trusts for good.
  # It checks out nothing but its own script, runs no yarn or cargo, and signs the update files
  # the build jobs made with the Tauri CLI's and minisign's pinned release binaries.
  sign-updates:
    name: Sign the update files
    needs: [verify, build]
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci/sign-updates.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: ${{ runner.temp }}/artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: dry-run-updater-key
          path: ${{ runner.temp }}/dry-run-key

      - name: Sign (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/dry-run-key/updater.key")" \
            PR_QUEST_UPDATER_PUBKEY="$(cat "$RUNNER_TEMP/dry-run-key/updater.key.pub")" \
            bash scripts/ci/sign-updates.sh "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/signatures" "$VERSION"

      - name: Sign
        if: github.event_name == 'push'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PR_QUEST_UPDATER_PUBKEY: ${{ vars.PR_QUEST_UPDATER_PUBKEY }}
        run: bash scripts/ci/sign-updates.sh "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/signatures" "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater-signatures
          path: ${{ runner.temp }}/signatures/
          if-no-files-found: error
          retention-days: 7

  assets:
    name: Check the release files
    needs: [verify, sign-updates]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-yarn

      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: just@1.59.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: ${{ runner.temp }}/artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: updater-signatures
          path: ${{ runner.temp }}/artifacts/updater-signatures

      # The update signatures are checked against the key the apps were built with, and
      # latest.json points at where the publish job uploads them. A dry run names the tag its
      # version would get, and is the only run that accepts unsigned macOS and Windows bundles.
      - name: Check the update signatures and write latest.json
        env:
          PR_QUEST_UPDATER_PUBKEY: ${{ github.event_name == 'push' && vars.PR_QUEST_UPDATER_PUBKEY || needs.verify.outputs.dry-run-pubkey }}
          VERSION: ${{ needs.verify.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          flags=()
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            flags+=(--dry-run)
          fi
          bash scripts/ci/release-assets.sh "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/assets" "$VERSION" \
            "https://github.com/$REPO/releases/download/v$VERSION" "${flags[@]}"
          {
            echo '### latest.json'
            echo '```json'
            cat "$RUNNER_TEMP/assets/latest.json"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # The only job that can write to the repository. It runs none of the repository's code: it
  # downloads the checked files, attests them and hands them to gh.
  publish:
    name: Publish the draft release
    needs: [verify, assets]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      # For the build provenance attestation alone.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets

      # Exactly what release-assets.sh checked: the four installers that don't update themselves,
      # the five update files and their signatures, latest.json and SHA256SUMS.txt.
      - name: Check the release files
        working-directory: ${{ runner.temp }}/assets
        run: |
          if [[ -e DRY-RUN ]]; then
            echo "::error title=Release assets::These are a dry run's files, which may be unsigned."
            exit 1
          fi
          count="$(find . -mindepth 1 | wc -l | tr -d ' ')"
          if [[ "$count" != 16 || ! -f latest.json || ! -f SHA256SUMS.txt ]]; then
            echo "::error title=Release assets::Expected the 16 checked release files, found $count."
            exit 1
          fi
          listed="$(wc -l <SHA256SUMS.txt | tr -d ' ')"
          if [[ "$listed" != 15 ]]; then
            echo "::error title=Release assets::SHA256SUMS.txt lists $listed files, not 15."
            exit 1
          fi
          sha256sum --check --strict SHA256SUMS.txt

      # Signed by GitHub, so anyone can check an installer came from this workflow and commit with
      # `gh attestation verify`. GitHub offers attestations for public repositories, and for
      # private ones only on GitHub Enterprise Cloud.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-checksums: ${{ runner.temp }}/assets/SHA256SUMS.txt

      # One job creates the release, so the build jobs can't race to create several.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          assets="$RUNNER_TEMP/assets"
          # The tag could have been moved or recreated while the builds ran.
          tagged="$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq .sha)"
          if [[ "$tagged" != "$GITHUB_SHA" ]]; then
            echo "::error title=Tag moved::$TAG points at $tagged now, but these installers were built from $GITHUB_SHA. Release a new version instead."
            exit 1
          fi
          if is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$is_draft" != true ]]; then
              echo "::error title=Already published::The release for $TAG is published already; tag a new version instead."
              exit 1
            fi
            gh release upload "$TAG" "$assets"/* --clobber
          else
            flags=()
            if [[ "$PRERELEASE" == true ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" "$assets"/* --draft --verify-tag --generate-notes \
              --title "PR Quest $VERSION" "${flags[@]}"
          fi
          echo "Draft release: $(gh release view "$TAG" --json url --jq .url)" >>"$GITHUB_STEP_SUMMARY"
