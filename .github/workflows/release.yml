# Builds the desktop installers on one runner per platform and processor, smoke-tests each, and
# publishes them with electron-updater's update files to one draft GitHub Release. Pushing a v* tag
# releases; running the workflow by hand is a dry run that builds unsigned installers, keeps them as
# workflow artifacts and publishes nothing. See RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  # Never stop a release halfway through publishing; a newer dry run replaces an older one.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Check the version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Match the tag to package.json
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version="$(jq -r .version package.json)"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error title=Version mismatch::The tag is $GITHUB_REF_NAME, but package.json has version $version. Tag the commit that sets the version, as v$version."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
              echo "::error title=Not on $DEFAULT_BRANCH::$GITHUB_REF_NAME points at a commit that isn't on $DEFAULT_BRANCH. Release from $DEFAULT_BRANCH."
              exit 1
            fi
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >>"$GITHUB_OUTPUT"
          echo "Version $version (prerelease: $prerelease)" >>"$GITHUB_STEP_SUMMARY"

  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-yarn

      # `just check` without its build, which every build job runs anyway.
      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Test
        run: yarn test

  build:
    name: Build ${{ matrix.name }}
    needs: [verify, check]
    runs-on: ${{ matrix.runner }}
    # Notarization alone can take a while.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Yarn installs the Cursor SDK's native parts for the runner's own processor only, so every
      # build runs on a runner of its own processor.
      matrix:
        include:
          - { id: mac-arm64, name: macOS arm64, runner: macos-15 }
          - { id: mac-x64, name: macOS x64, runner: macos-15-intel }
          - { id: win-x64, name: Windows x64, runner: windows-2025 }
          - { id: linux-x64, name: Linux x64, runner: ubuntu-24.04 }
          - { id: linux-arm64, name: Linux arm64, runner: ubuntu-24.04-arm }
    env:
      # A release build, the only kind that checks for updates and gets electron-updater's files,
      # of the repository it updates from and Help opens; see src/desktop/release.ts. Dry runs
      # build the same, so they test what a release ships.
      PR_QUEST_RELEASE_BUILD: '1'
      PR_QUEST_RELEASE_REPO: ${{ vars.PR_QUEST_RELEASE_REPO || github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-yarn

      # Signing secrets reach only the packaging step of a tag build on their own platform.
      - name: Package
        if: github.event_name != 'push' || runner.os == 'Linux'
        run: bash scripts/package-release.sh

      - name: Package and sign
        id: mac
        if: github.event_name == 'push' && runner.os == 'macOS'
        env:
          REQUIRE_SIGNING: ${{ vars.REQUIRE_SIGNING }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/package-release.sh

      - name: Package and sign
        id: win
        if: github.event_name == 'push' && runner.os == 'Windows'
        env:
          REQUIRE_SIGNING: ${{ vars.REQUIRE_SIGNING }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ secrets.AZURE_SIGNING_PUBLISHER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: bash scripts/package-release.sh

      - name: Check the signature and notarization
        if: steps.mac.outputs.signed == 'true'
        run: |
          for app in release/mac*/"PR Quest.app"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          done

      - name: Check the signature
        if: steps.win.outputs.signed == 'true'
        shell: pwsh
        run: |
          foreach ($file in @(Get-ChildItem release/pr-quest-*.exe) + @(Get-Item 'release/win-unpacked/PR Quest.exe')) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.Name): $($signature.Status) $($signature.StatusMessage)" }
            "$($file.Name): signed by $($signature.SignerCertificate.Subject)"
          }

      # No channel on any platform, and a signed Windows build must name its publisher so the
      # updater checks who signed an update. The NSIS installer packs win-unpacked as it is.
      - name: Check the update settings
        shell: bash
        env:
          WINDOWS_SIGNED: ${{ steps.win.outputs.signed }}
        run: |
          shopt -s nullglob
          files=(release/mac*/"PR Quest.app"/Contents/Resources/app-update.yml release/win*-unpacked/resources/app-update.yml release/linux*-unpacked/resources/app-update.yml)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error title=Update settings::the build has no app-update.yml"
            exit 1
          fi
          flags=()
          if [ "$WINDOWS_SIGNED" = true ]; then flags=(--signed); fi
          for file in "${files[@]}"; do
            node scripts/check-update-config.ts "$file" "${flags[@]}"
          done

      - name: Smoke test
        if: runner.os == 'macOS'
        run: |
          yarn desktop:smoke
          bash scripts/smoke-dmg.sh release/pr-quest-*.dmg

      - name: Smoke test
        if: runner.os == 'Windows'
        run: yarn desktop:smoke

      - name: Smoke test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb libfuse2t64
          # Ubuntu 24.04 keeps unprivileged programs out of user namespaces, and Chromium's sandbox
          # needs one when chrome-sandbox isn't setuid root, as in an AppImage.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run --auto-servernum yarn desktop:smoke
          xvfb-run --auto-servernum yarn desktop:smoke release/pr-quest-*.AppImage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.id }}
          path: |
            release/pr-quest-*
            release/*.yml
            !release/builder-debug.yml
          if-no-files-found: error
          retention-days: 7
          # The installers are compressed already.
          compression-level: 0

  publish:
    name: Publish the draft release
    needs: [verify, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: artifacts

      - name: Collect the release assets
        run: bash scripts/collect-release-assets.sh artifacts assets

      # One job creates the release, so the build jobs can't race to create several.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$is_draft" != true ]]; then
              echo "::error title=Already published::The release for $TAG is published already; tag a new version instead."
              exit 1
            fi
            gh release upload "$TAG" assets/* --clobber
          else
            flags=()
            if [[ "$PRERELEASE" == true ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" assets/* --draft --verify-tag --generate-notes \
              --title "PR Quest $VERSION" "${flags[@]}"
          fi
          echo "Draft release: $(gh release view "$TAG" --json url --jq .url)" >>"$GITHUB_STEP_SUMMARY"
