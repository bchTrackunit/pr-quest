name: Set up the desktop build
description: >-
  Installs what building, checking and smoke-testing the Tauri desktop app needs besides Node and
  Yarn: Rust, just and, on Linux, the WebKitGTK packages and pinned AppImage tools. Run it after
  setup-yarn.

inputs:
  cache:
    description: >-
      Restore Rust's build cache (Swatinem/rust-cache). Release builds leave it off: the compiled
      crates in it aren't checked against anything, unlike the sources in Cargo.lock.
    default: 'false'
  save-cache:
    description: Save the Rust cache at the end of the job, when `cache` is on.
    default: 'false'
  cache-key:
    description: Added to the Rust cache key, such as the target triple.
    default: ''
  linux-smoke:
    description: On Linux, also install what the headless smoke test needs.
    default: 'false'

runs:
  using: composite
  steps:
    # The version, components and targets in rust-toolchain.toml, installed up front rather than
    # on first use in the middle of a build step.
    - name: Install Rust
      shell: bash
      run: |
        rustup toolchain install --no-self-update
        rustc --version

    - if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: apps/desktop/src-tauri -> target
        key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save-cache == 'true' }}

    # Checks each download against the SHA-256 in its own manifest.
    - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
      with:
        tool: just@1.59.0

    # Tauri 2's Linux prerequisites without libayatana-appindicator, which only a tray icon needs.
    - name: Install the Linux packages
      if: runner.os == 'Linux'
      shell: bash
      env:
        SMOKE: ${{ inputs.linux-smoke }}
      run: |
        packages=(
          build-essential file patchelf libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
          libdbus-1-dev libssl-dev libxdo-dev
        )
        if [[ "$SMOKE" == true ]]; then
          packages+=(xvfb xauth dbus gnome-keyring)
        fi
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends "${packages[@]}"

    # WebKitGTK sandboxes its web processes with bubblewrap, which needs unprivileged user
    # namespaces; Ubuntu 24.04 and later restrict them with AppArmor. Only on this throwaway runner.
    - name: Allow user namespaces for WebKitGTK's sandbox
      if: runner.os == 'Linux' && inputs.linux-smoke == 'true'
      shell: bash
      run: |
        setting=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
        if [[ -f "$setting" && "$(cat "$setting")" != 0 ]]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi

    - name: Pin the AppImage tools Tauri downloads
      if: runner.os == 'Linux'
      shell: bash
      run: bash scripts/ci/seed-tauri-tools.sh
